# Demo build (plan 173, decision 338): the full config with the demo's names and the demo client; `trivia-desktop-build --demo`.
extends: ./electron-builder.yml
appId: io.github.rubenmoor.trivia.demo
productName: Living Room Trivia Demo
executableName: living-room-trivia-demo
extraMetadata:
  description: Living Room Trivia Demo
  demo: true  # main.mjs isDemo()
artifactName: LivingRoomTriviaDemo-${version}-${os}-${arch}.${ext}
directories:
  output: release/demo
# Data and media: the full config's env-driven extraResources (extends appends arrays, so no list here; decision 342).
# The default exclusion covers release/demo only, not the full build's outputs in release/: excluded per platform (the global `files` is not applied).
win:
  executableName: LivingRoomTriviaDemo
  files:
    - "!release{,/**/*}"
linux:
  files:
    - "!release{,/**/*}"
