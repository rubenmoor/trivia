# Local builds (plan 56, SW-5): Windows x64 zip, Linux x64 tar.gz; `trivia-desktop-build` (`npm run dist` skips `qgen validate`).
appId: io.github.rubenmoor.trivia
productName: Living Room Trivia  # store name (D-50, decision 176)
executableName: living-room-trivia
extraMetadata:
  description: Living Room Trivia  # exe FileDescription (Task Manager), Linux Comment
artifactName: LivingRoomTrivia-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - package.json
  - main.mjs
  - lag-probe.html  # PLACEHOLDER(1486)
  - mods.mjs
  - mute.mjs
  - workshop.mjs
  - publish.mjs
  - check-mod.mjs
  - report.mjs
  - resolve.mjs
  - telemetry.mjs
  - save.mjs
  - preload.cjs
# Steam binding (plan 85): koffi loads native files from disk, not from the asar.
asarUnpack:
  - node_modules/steamworks-ffi-node/**
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: ../client/${env.TRIVIA_CLIENT_DIST}  # dist, or dist-demo (package.json scripts)
    to: client
  - from: ${env.TRIVIA_DATA_DIR}  # ../data, or build/data-demo (stage-media --demo)
    to: data
  - from: ${env.TRIVIA_MEDIA_DIR}  # build/media, or build/media-demo
    to: media
extraFiles:
  - from: ../client/${env.TRIVIA_CLIENT_DIST}/CREDITS.md
    to: CREDITS.md
  - from: ../../LICENSE  # D-102
    to: LICENSE
  - from: ../../LICENSE-content.md
    to: LICENSE-content.md
  - from: ../../modding  # player kit and guide (decisions 133, 134)
    to: modding
npmRebuild: false
# Pinned (from v43.7.7's SHASUMS256.txt): cached zips verify offline; update with electron's version.
electronDownload:
  force: false  # marks @electron/get options, so checksums pass through
  checksums:
    electron-v43.7.7-linux-x64.zip: 4d0a48398c444258dbcf2f5f83b49ca5bc53583130f354e0c299dad5b22b5271
    electron-v43.7.7-win32-x64.zip: 97dcb75065444ef031b9b6ea814ccd2109b97934fffb0c503a555d4737ca79cc
publish: null
afterPack: ./after-pack.mjs
win:
  executableName: LivingRoomTrivia
  files:  # the other platforms' native binaries
    - "!node_modules/@koromix/koffi-linux-*/**"
    - "!node_modules/steamworks-ffi-node/prebuilds/{darwin,linux}-*/**"
  extraResources:
    - from: steamworks_sdk/redistributable_bin/win64/steam_api64.dll
      to: steamworks_sdk/redistributable_bin/win64/steam_api64.dll
  signExecutable: false  # resedit sets icon + metadata (no wine); unsigned (B-11)
  icon: icon.png  # decision 87: capsules.mjs's icon-1024.png
linux:
  category: Game
  icon: icon.png
  files:
    - "!node_modules/@koromix/koffi-win32-*/**"
    - "!node_modules/steamworks-ffi-node/prebuilds/{darwin,win32}-*/**"
  extraResources:
    - from: steamworks_sdk/redistributable_bin/linux64/libsteam_api.so
      to: steamworks_sdk/redistributable_bin/linux64/libsteam_api.so
