<!doctype html>
<!-- Example full conversion (MIT): this file wins over the game's index.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Guess the number</title>
    <style>
      /* /fonts/ isn't in this mod: it falls through to the game's files. */
      @font-face { font-family: "Baloo 2"; src: url("/fonts/baloo-2.woff2") format("woff2"); font-weight: 400 800; }
      body { margin: 0; height: 100vh; display: grid; place-content: center; text-align: center; gap: 3vh;
        background: #1a0b20; color: #eef1f6; font: 4vh "Baloo 2", sans-serif; user-select: none; }
      #guess { font-size: 20vh; font-weight: 800; color: #ffb81c; }
      button { font: inherit; padding: 0 3vh; border-radius: 2vh; border: 0; cursor: pointer; vertical-align: middle; }
      small { opacity: 0.6; font-size: 2.5vh; }
    </style>
  </head>
  <body>
    <div>I picked a number from 1 to 100.</div>
    <div><button id="down">−</button> <span id="guess">50</span> <button id="up">+</button></div>
    <div id="hint">↑ ↓ or the pad to change, Enter or A to guess</div>
    <div><button id="go">Guess</button> <button id="quit">Quit</button></div>
    <small>Esc or pad B quits. Start with --no-mods to get the game back.</small>
    <script type="module" src="./main.js"></script>
  </body>
</html>
